<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập – Quản lý</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;background:#f3f5ff;min-height:100vh;display:grid;place-items:center;font-size:18px;padding:1rem}
form{background:#fff;padding:2rem;border-radius:18px;box-shadow:0 12px 40px rgba(18,35,79,.15);width:100%;max-width:400px;display:grid;gap:1rem}
h1{font-size:1.5rem;color:#12234f}
input{font:inherit;padding:.9rem 1rem;border:2px solid #12234f;border-radius:12px;width:100%}
input:focus{outline:3px solid #ffb84d}
button{font:inherit;font-weight:700;padding:.95rem;border:0;border-radius:12px;background:#2a4cff;color:#fff;cursor:pointer}
button:hover{background:#1636d6}
.loi{color:#c0261d;font-weight:600}
</style>
</head>
<body>
<form method="post">
  <h1>Đăng nhập xem yêu cầu tư vấn</h1>
  {% with messages = get_flashed_messages() %}{% if messages %}<p class="loi" role="alert">{{ messages[0] }}</p>{% endif %}{% endwith %}
  <input type="password" name="matkhau" placeholder="Nhập mật khẩu" autofocus required aria-label="Mật khẩu">
  <button type="submit">Đăng nhập</button>
</form>
</body>
</html>
